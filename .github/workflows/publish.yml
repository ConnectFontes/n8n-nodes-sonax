name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        type: choice
        default: 'both'
        options:
          - both
          - sonax-voip
          - sonax-chat

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Update npm (needed for OIDC trusted publishing)
        run: 'npm install -g npm@latest'
      - name: Check publication metadata
        run: |
          node -e "
            for (const dir of ['sonax-voip', 'sonax-chat']) {
              const pkg = require('./' + dir + '/package.json');
              if (!pkg.repository?.url) throw new Error('Set the real repository URL in ' + dir + '/package.json before publishing');
            }
          "
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # On every push to main, publish only the package(s) whose version isn't on npm yet,
      # so pushing an unrelated commit never retries an already-published version.
      - name: Check published versions
        id: versions
        run: |
          for dir in sonax-voip sonax-chat; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            key=$(echo "$dir" | tr '-' '_')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$key=false" >> "$GITHUB_OUTPUT"
            else
              echo "$key=true" >> "$GITHUB_OUTPUT"
            fi
          done
      # @n8n/node-cli's own prepublishOnly hook refuses a bare `npm publish` (it requires
      # RELEASE_MODE, only set by `n8n-node release`). `n8n-node release` detects CI via the
      # GITHUB_ACTIONS env var (set automatically here) and then lints, builds and runs
      # `npm publish` itself with provenance enabled. `npm run release --workspace <pkg>` runs
      # that command with its cwd set to the package, which is what `release` needs to publish
      # the right one. If NPM_TOKEN is set, this authenticates with it (works for a package's very
      # first publish, before Trusted Publishing can be configured for it on npmjs.com); otherwise
      # npm uses the OIDC credential from id-token: write above.
      - name: Publish sonax-voip
        if: >-
          !cancelled() && steps.versions.outputs.sonax_voip == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.package == 'both' || inputs.package == 'sonax-voip')
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release --workspace sonax-voip
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sonax-chat
        if: >-
          !cancelled() && steps.versions.outputs.sonax_chat == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.package == 'both' || inputs.package == 'sonax-chat')
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release --workspace sonax-chat
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
